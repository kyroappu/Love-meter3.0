<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff4f81">
<title>Love Calculator ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#432333;background:radial-gradient(circle at top,#ffe2ed,transparent 45%),linear-gradient(135deg,#fff1f5,#ffd3e1)}
.card{width:100%;max-width:430px;background:#ffffffef;border-radius:26px;padding:26px 22px;text-align:center;box-shadow:0 18px 55px #be2c5b29;border:1px solid #ffffff}
.heart{font-size:52px;animation:beat 1.2s infinite}@keyframes beat{50%{transform:scale(1.1)}}
h1{margin:10px 0 8px;font-size:clamp(25px,7vw,32px);color:#e83270}
.subtitle{margin:0 0 24px;color:#805b6b;font-size:14px}
label{display:block;text-align:left;font-weight:700;margin:14px 0 7px}
input{width:100%;padding:14px 15px;border:1.5px solid #f2bfd0;border-radius:13px;font-size:16px;outline:none;background:#fffafd}
input:focus{border-color:#ed4c83;box-shadow:0 0 0 3px #ffe0eb}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff4f81,#e72f70);color:white;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #e72f703d}
.page{display:none}.page.active{display:block}
#percent{color:#e83270;font-size:58px;font-weight:900;margin:8px 0}
.meter{height:12px;background:#f7c9d9;border-radius:99px;overflow:hidden;margin:12px 0}
#bar{width:0;height:100%;background:linear-gradient(90deg,#ff9bba,#e83270);border-radius:99px;transition:width 1s ease}
#message{font-weight:700;margin:12px 0}
.names{font-weight:700;overflow-wrap:anywhere}
.note{font-size:11px;color:#987b88;margin:20px 0 0}
</style>
</head>
<body>
<main class="card">
  <section id="page1" class="page active">
    <div class="heart">💘</div>
    <h1>Love Calculator</h1>
    <p class="subtitle">Enter two names to discover your fun love-match percentage!</p>
    <form id="loveForm">
      <label for="yourName">Your name</label>
      <input id="yourName" type="text" placeholder="Enter your name" maxlength="40" required>
      <label for="partnerName">Your crush's / partner's name</label>
      <input id="partnerName" type="text" placeholder="Enter their name" maxlength="40" required>
      <button type="submit">Calculate Love ❤️</button>
    </form>
    <p class="note">Just for fun ❤️ This is not a real measure of compatibility.</p>
  </section>

  <section id="page2" class="page" aria-live="polite">
    <div class="heart">💞</div>
    <h1>Your Love Result!</h1>
    <p id="names" class="names"></p>
    <div id="percent">0%</div>
    <div class="meter"><div id="bar"></div></div>
    <p id="message"></p>
    <p class="subtitle">Remember: love is about care, trust, and understanding. 💗</p>
    <button type="button" id="again">Calculate Again 🔄</button>
    <p class="note">For entertainment only — not a scientific result.</p>
  </section>
</main>
<script>
const form=document.getElementById('loveForm');
const page1=document.getElementById('page1');
const page2=document.getElementById('page2');
function loveScore(name1,name2){
  const pair=[name1.trim().toLowerCase(),name2.trim().toLowerCase()].sort().join('|');
  let hash=7;
  for(let i=0;i<pair.length;i++) hash=(hash*31+pair.charCodeAt(i))%1000003;
  return 50+(hash%51);
}
form.addEventListener('submit',function(event){
  event.preventDefault();
  const name1=document.getElementById('yourName').value.trim();
  const name2=document.getElementById('partnerName').value.trim();
  if(!name1||!name2){return;}
  const score=loveScore(name1,name2);
  document.getElementById('names').textContent=name1+' ❤️ '+name2;
  document.getElementById('percent').textContent=score+'%';
  document.getElementById('message').textContent=score>=90?'Made for each other! 💞':score>=80?'A lovely match! 💖':score>=70?'There could be a sweet spark! 💗':'A little mystery makes love interesting! 💕';
  page1.classList.remove('active');
  page2.classList.add('active');
  document.getElementById('bar').style.width='0%';
  requestAnimationFrame(()=>{document.getElementById('bar').style.width=score+'%';});
  window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('again').addEventListener('click',function(){
  form.reset();
  page2.classList.remove('active');
  page1.classList.add('active');
  document.getElementById('bar').style.width='0%';
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
