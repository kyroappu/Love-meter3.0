<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4f81">
  <title>Love Percentage Calculator ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #432333;
      background: radial-gradient(circle at top, #ffe2ed, transparent 45%),
                  linear-gradient(135deg, #fff1f5, #ffd3e1);
    }
    .card {
      width: 100%; max-width: 430px; background: rgba(255,255,255,.94);
      border-radius: 26px; padding: 28px 22px; text-align: center;
      box-shadow: 0 18px 55px rgba(190, 44, 91, .16);
      border: 1px solid rgba(255,255,255,.9);
    }
    .heart { font-size: 54px; line-height: 1.2; animation: beat 1.2s infinite; }
    @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    h1 { margin: 12px 0 8px; font-size: clamp(25px, 7vw, 32px); color: #e83270; }
    .subtitle { margin: 0 0 24px; color: #805b6b; font-size: 14px; }
    label { display: block; text-align: left; font-weight: 700; margin: 14px 0 7px; }
    input {
      width: 100%; padding: 14px 15px; border: 1.5px solid #f2bfd0;
      border-radius: 13px; font-size: 16px; outline: none; background: #fffafd;
    }
    input:focus { border-color: #ed4c83; box-shadow: 0 0 0 3px #ffe0eb; }
    button {
      width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 14px;
      background: linear-gradient(135deg, #ff4f81, #e72f70); color: white;
      font-size: 17px; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 18px rgba(231,47,112,.24);
    }
    button:active { transform: scale(.99); }
    #result { display: none; margin-top: 24px; padding: 20px 14px; border-radius: 18px; background: #fff0f5; }
    #names { font-weight: 700; overflow-wrap: anywhere; }
    #percent { color: #e83270; font-size: 54px; font-weight: 900; margin: 8px 0; }
    .meter { height: 12px; background: #f7c9d9; border-radius: 99px; overflow: hidden; margin: 12px 0; }
    #bar { width: 0; height: 100%; background: linear-gradient(90deg, #ff9bba, #e83270); border-radius: 99px; transition: width 1s ease; }
    #message { margin: 10px 0 0; font-weight: 600; }
    .note { font-size: 11px; color: #987b88; margin: 20px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">💘</div>
    <h1>Love Calculator</h1>
    <p class="subtitle">Find out your fun love-match percentage!</p>

    <form id="loveForm">
      <label for="yourName">Your name</label>
      <input id="yourName" type="text" placeholder="Enter your name" maxlength="40" autocomplete="given-name" required>
      <label for="partnerName">Your crush's / partner's name</label>
      <input id="partnerName" type="text" placeholder="Enter their name" maxlength="40" autocomplete="off" required>
      <button type="submit">Calculate Love ❤️</button>
    </form>

    <section id="result" aria-live="polite">
      <div id="names"></div>
      <div id="percent">0%</div>
      <div class="meter"><div id="bar"></div></div>
      <p id="message"></p>
      <button type="button" id="again">Try Again 💕</button>
    </section>
    <p class="note">Just for fun ❤️ This percentage is not a real measure of love or compatibility.</p>
  </main>

  <script>
    const form = document.getElementById('loveForm');
    const result = document.getElementById('result');
    const percentText = document.getElementById('percent');
    const bar = document.getElementById('bar');
    const message = document.getElementById('message');

    // Gives the same fun result for the same pair of names.
    function loveScore(name1, name2) {
      const pair = [name1.trim().toLowerCase(), name2.trim().toLowerCase()].sort().join('|');
      let hash = 7;
      for (let i = 0; i < pair.length; i++) {
        hash = (hash * 31 + pair.charCodeAt(i)) % 1000003;
      }
      return 50 + (hash % 51); // 50–100%
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const name1 = document.getElementById('yourName').value.trim();
      const name2 = document.getElementById('partnerName').value.trim();
      if (!name1 || !name2) return;

      const score = loveScore(name1, name2);
      document.getElementById('names').textContent = name1 + ' ❤️ ' + name2;
      percentText.textContent = score + '%';
      message.textContent = score >= 90 ? 'Made for each other! 💞'
        : score >= 80 ? 'A lovely match! 💖'
        : score >= 70 ? 'There could be a sweet spark! 💗'
        : 'A little mystery makes love interesting! 💕';

      result.style.display = 'block';
      bar.style.width = '0%';
      requestAnimationFrame(() => { bar.style.width = score + '%'; });
      result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    document.getElementById('again').addEventListener('click', function () {
      form.reset();
      result.style.display = 'none';
      bar.style.width = '0%';
      document.getElementById('yourName').focus();
    });
  </script>
</body>
</html>
